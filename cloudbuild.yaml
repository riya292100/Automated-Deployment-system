# Google Cloud Build Pipeline for Autonomous Vercel Clone
# Builds container and deploys to Google Cloud Run (Fully Managed - Free Tier Eligible)
steps:
  # Step 1: Build Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/automated-deployment-system:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/automated-deployment-system:latest'
      - '.'

  # Step 2: Push container image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/automated-deployment-system:$COMMIT_SHA'

  # Step 3: Deploy to Google Cloud Run Free Tier (2 Million requests/month, 0$ cost)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'automated-deployment-system'
      - '--image'
      - 'gcr.io/$PROJECT_ID/automated-deployment-system:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--set-env-vars'
      - 'NODE_ENV=production,UNIFIED_SERVER=true,STORAGE_MODE=local'

images:
  - 'gcr.io/$PROJECT_ID/automated-deployment-system:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/automated-deployment-system:latest'

options:
  logging: CLOUD_LOGGING_ONLY

[project]
name = "python-data-edge-app"
version = "1.0.0"
description = "High-Performance Python 3.12+ Data Analysis & Edge Visualization Runtime"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

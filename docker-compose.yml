version: '3.8'

services:
  # 1. API Server & Dashboard Orchestrator
  api-server:
    build:
      context: .
      dockerfile: api-server/Dockerfile
    container_name: autodeploy-api-server
    ports:
      - '9000:9000'
    environment:
      - API_PORT=9000
      - REDIS_URL=redis://redis-service:6379
      - STORAGE_MODE=local
      - AWS_S3_BUCKET=automated-deployment-bucket
      - AWS_REGION=us-east-1
    depends_on:
      - redis-service
    volumes:
      - storage-volume:/app/storage/s3-bucket
    restart: unless-stopped

  # 2. S3 Reverse Proxy & Edge Router
  s3-reverse-proxy:
    build:
      context: .
      dockerfile: s3-reverse-proxy/Dockerfile
    container_name: autodeploy-reverse-proxy
    ports:
      - '8000:8000'
    environment:
      - PROXY_PORT=8000
      - REDIS_URL=redis://redis-service:6379
      - STORAGE_MODE=local
    depends_on:
      - redis-service
    volumes:
      - storage-volume:/app/storage/s3-bucket
    restart: unless-stopped

  # 3. Redis Cache & Real-Time Pub/Sub
  redis-service:
    image: redis:7-alpine
    container_name: autodeploy-redis
    ports:
      - '6379:6379'
    restart: unless-stopped

volumes:
  storage-volume:
